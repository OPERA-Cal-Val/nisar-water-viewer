[site]
pages_url = "https://opera-cal-val.github.io/nisar-water-viewer/"
data = "pages"

[bucket]
name = "nisar-water-viewer"
region = "us-west-2"

[examples.validation]
title = "Validation sites"
description = "UMD validation chips with Good NISAR GCOV: nisar-water vs DSWx-NI, with the DSWx-HLS and DSWx-S1 granules used in verification."
kind = "sites"

[examples.validation.sources]
nisar_water = "../nisar-water/examples/validation"
dswx_ni = "../DSWx-Requirement-Verification-v2/data/DSWx-NIopen water maps for calibration sites20261005053839/calval_openwater/Good"
tables = [
    "../DSWx-Requirement-Verification-v2/src/dswx_req/data/umd_chips.geojson",
    "../DSWx-Requirement-Verification-v2/dswx_out_analysis/2026/ni_table.parquet",
    "../DSWx-Requirement-Verification-v2/dswx_out_analysis/2026/products.parquet",
    "../DSWx-Requirement-Verification-v2/dswx_out_analysis/2026/results.parquet",
]

[examples.congaree]
title = "Congaree National Park Wilderness, SC"
description = "Ascending and descending nisar-water time series over the Congaree floodplain forest, with DSWx-NI on 2026-10-07 and 2026-10-08."
kind = "timeseries"

[examples.congaree.sources]
nisar_water = "../nisar-water/examples/congaree"
dswx_ni = "~/Desktop/congaree_opera_dswx-ni"

[examples.oregon_lakes]
title = "South-central Oregon lakes and marshes"
description = "Ascending and descending nisar-water time series over Summer Lake, Lake Abert, Warner Lakes and Sycan Marsh."
kind = "timeseries"

[examples.oregon_lakes.sources]
nisar_water = "../nisar-water/examples/oregon_lakes"
aois = [
    "../nisar-water/extent_data/warner_lakes.parquet",
    "../nisar-water/extent_data/sycan_marsh.parquet",
]

[examples.central_valley]
title = "Sacramento Valley, CA"
description = "Ascending and descending nisar-water time series over Central Valley agriculture in Colusa and Yolo counties."
kind = "timeseries"

[examples.central_valley.sources]
nisar_water = "../nisar-water/examples/central_valley"

[examples.oregon_spotted_frog]
title = "Oregon Spotted Frog site, OR"
description = "Ascending and descending nisar-water time series over a small Oregon spotted frog wetland site (a minimum-resolution test)."
kind = "timeseries"

[examples.oregon_spotted_frog.sources]
nisar_water = "../nisar-water/examples/oregon_spotted_frog"

[examples.leetown]
title = "Leetown Science Center, WV"
description = "Ascending and descending nisar-water time series over the Leetown Science Center (a minimum-resolution test)."
kind = "timeseries"

[examples.leetown.sources]
nisar_water = "../nisar-water/examples/leetown"

[examples.blackwater]
title = "Blackwater National Wildlife Refuge, MD"
description = "Ascending nisar-water time series over the tidal marshes of Blackwater National Wildlife Refuge (inundated vegetation)."
kind = "timeseries"

[examples.blackwater.sources]
nisar_water = "../nisar-water/examples/blackwater"
